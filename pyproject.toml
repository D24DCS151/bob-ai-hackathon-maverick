[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "threaticap"
version = "1.0.0"
description = "Threat Intelligence Correlation & Alert Prioritisation System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Defence Use Only" }
keywords = ["cybersecurity", "threat-intelligence", "correlation", "mitre-attack", "soc", "bluf"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
]
production = [
    # PostgreSQL async/sync drivers
    "psycopg2-binary>=2.9.9",
    # Redis Streams support
    "redis>=5.0.1",
    # Structured logging
    "structlog>=24.1.0",
    # Graph-based correlation
    "networkx>=3.2.0",
    # Prometheus metrics exposition
    "prometheus-client>=0.19.0",
    # JWT (RS256/HS256) — [cryptography] pulls cryptography package for RS256
    "python-jose[cryptography]>=3.3.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]
stix = [
    "stix2>=3.0.1",
    "taxii2-client>=2.3.0",
]
# Convenience extra: installs everything needed for a full production deployment
full = [
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "structlog>=24.1.0",
    "networkx>=3.2.0",
    "prometheus-client>=0.19.0",
    "python-jose[cryptography]>=3.3.0",
    "stix2>=3.0.1",
    "taxii2-client>=2.3.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]

[project.scripts]
threaticap = "threaticap.cli:cli"

[project.urls]
Repository = "https://github.com/defence-org/threaticap"

[tool.setuptools.packages.find]
where = ["."]
include = ["threaticap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
addopts = "--tb=short -v"

[tool.coverage.run]
source = ["threaticap"]
omit = ["tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
