# MITRE ATT&CK Knowledge Base
# Maintainable configuration-driven technique definitions.
#
# This file contains a representative set of techniques covering common
# defence-relevant scenarios. For production use, replace with data derived
# from the official MITRE ATT&CK STIX bundle:
#   https://github.com/mitre/cti/tree/master/enterprise-attack
#
# Each technique entry format:
#   id:              Technique ID (T####) or sub-technique (T####.###)
#   name:            Official technique name
#   tactic_ids:      List of parent tactic IDs (TA####)
#   description:     Summary description
#   detection_notes: How to detect this technique
#   mitigations:     Recommended mitigations
#   platforms:       Applicable platforms
#   data_sources:    ATT&CK data sources for detection

techniques:

  # ==========================================================================
  # Initial Access (TA0001)
  # ==========================================================================

  - id: T1190
    name: "Exploit Public-Facing Application"
    tactic_ids: ["TA0001"]
    description: >
      Adversaries may attempt to take advantage of a weakness in an Internet-facing
      computer or program using software, data, or commands in order to cause
      unintended or unanticipated behaviour.
    detection_notes: >
      Monitor application logs for unusual requests. Look for 4xx/5xx HTTP errors
      followed by successful exploitation patterns. Enable WAF logging.
    mitigations:
      - "Apply security patches promptly"
      - "Deploy Web Application Firewall (WAF)"
      - "Implement network segmentation for public-facing services"
    platforms: ["Linux", "Windows", "macOS", "Network", "Containers"]
    data_sources: ["Application Log: Application Log Content", "Network Traffic: Network Traffic Content"]

  - id: T1566
    name: "Phishing"
    tactic_ids: ["TA0001"]
    description: >
      Adversaries may send phishing messages to gain access to victim systems.
      All forms of phishing are electronically delivered social engineering.
    detection_notes: >
      Monitor for suspicious email attachments and links. Check for macro execution
      in Office documents. Monitor DNS for newly registered domains in email headers.
    mitigations:
      - "Deploy email gateway filtering"
      - "Enable DMARC/DKIM/SPF"
      - "User security awareness training"
      - "Disable macros by policy"
    platforms: ["Linux", "Windows", "macOS", "Office Suite", "SaaS"]
    data_sources: ["Application Log: Application Log Content", "Network Traffic: Network Traffic Flow"]

  - id: T1566.001
    name: "Phishing: Spearphishing Attachment"
    tactic_ids: ["TA0001"]
    description: >
      Adversaries may send spearphishing emails with a malicious attachment in an
      attempt to gain access to victim systems.
    detection_notes: >
      Monitor for Office document execution with macro execution (WINWORD spawning
      cmd.exe/powershell.exe). Check AV detections on email attachments.
    mitigations:
      - "Disable macros in Office suite by Group Policy"
      - "Use Protected View for email attachments"
      - "Deploy sandbox-based email analysis"
    platforms: ["Linux", "Windows", "macOS"]
    data_sources: ["File: File Creation", "Process: Process Creation"]

  - id: T1078
    name: "Valid Accounts"
    tactic_ids: ["TA0001", "TA0003", "TA0004", "TA0005"]
    description: >
      Adversaries may obtain and abuse credentials of existing accounts as a means
      of gaining Initial Access, Persistence, Privilege Escalation, or Defense Evasion.
    detection_notes: >
      Monitor for logons outside normal hours or from unusual locations.
      Look for password spraying patterns (many failed logins then success).
      Enable impossible travel detection if geo-data available.
    mitigations:
      - "Enable multi-factor authentication (MFA)"
      - "Implement privileged access workstations (PAW)"
      - "Monitor and alert on after-hours logins"
    platforms: ["Windows", "Linux", "macOS", "Azure AD", "Office 365", "SaaS"]
    data_sources: ["Logon Session: Logon Session Creation", "User Account: User Account Authentication"]

  # ==========================================================================
  # Execution (TA0002)
  # ==========================================================================

  - id: T1059
    name: "Command and Scripting Interpreter"
    tactic_ids: ["TA0002"]
    description: >
      Adversaries may abuse command and script interpreters to execute commands,
      scripts, or binaries.
    detection_notes: >
      Monitor for cmd.exe, powershell.exe, wscript.exe, cscript.exe spawned by
      unusual parent processes (Office, browser, email client).
    mitigations:
      - "Disable or restrict script execution via Group Policy"
      - "Enable PowerShell logging (Module, Script Block, Transcription)"
      - "Apply application control (AppLocker/WDAC)"
    platforms: ["Windows", "Linux", "macOS", "Network"]
    data_sources: ["Command: Command Execution", "Process: Process Creation"]

  - id: T1059.001
    name: "Command and Scripting Interpreter: PowerShell"
    tactic_ids: ["TA0002"]
    description: >
      Adversaries may abuse PowerShell commands and scripts for execution.
      PowerShell is a powerful interactive command-line interface and scripting
      environment included in the Windows operating system.
    detection_notes: >
      Enable PowerShell Script Block Logging (Event ID 4104). Watch for
      encoded commands (-EncodedCommand), download cradles (IEX/Invoke-Expression),
      and AMSI bypass attempts.
    mitigations:
      - "Enable PowerShell Constrained Language Mode"
      - "Block powershell.exe from user directories via AppLocker"
      - "Enable Script Block Logging"
    platforms: ["Windows"]
    data_sources: ["Command: Command Execution", "Module: Module Load", "Process: Process Creation", "Script: Script Execution"]

  - id: T1059.003
    name: "Command and Scripting Interpreter: Windows Command Shell"
    tactic_ids: ["TA0002"]
    description: >
      Adversaries may abuse the Windows command shell for execution. The Windows
      command shell (cmd.exe) is the primary command prompt on Windows systems.
    detection_notes: >
      Monitor for cmd.exe spawned by unusual parent processes. Watch for command
      line parameters that invoke encoded/obfuscated commands.
    mitigolds:
      - "Monitor and restrict cmd.exe execution via application control"
    platforms: ["Windows"]
    data_sources: ["Command: Command Execution", "Process: Process Creation"]

  # ==========================================================================
  # Persistence (TA0003)
  # ==========================================================================

  - id: T1053
    name: "Scheduled Task/Job"
    tactic_ids: ["TA0002", "TA0003", "TA0004"]
    description: >
      Adversaries may abuse task scheduling functionality to facilitate initial
      or recurring execution of malicious code. Utilities exist within all major
      operating systems to schedule programs or scripts to be executed at a
      specified date and time.
    detection_notes: >
      Monitor Windows Event ID 4698/4699/4702 (task creation/deletion/modification).
      Check schtasks.exe executions. Audit cron/at job additions on Linux.
    mitigations:
      - "Enable audit logging for scheduled task changes"
      - "Apply least privilege to task creation permissions"
      - "Periodically review scheduled tasks for unauthorised entries"
    platforms: ["Windows", "Linux", "macOS"]
    data_sources: ["Scheduled Job: Scheduled Job Creation", "Process: Process Creation"]

  - id: T1547
    name: "Boot or Logon Autostart Execution"
    tactic_ids: ["TA0003", "TA0004"]
    description: >
      Adversaries may configure system settings to automatically execute a program
      during system boot or logon to maintain persistence or gain higher-level privileges.
    detection_notes: >
      Monitor Registry Run keys and Startup folder modifications.
      Watch for new services being registered. Check for suspicious entries in
      HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run.
    mitigations:
      - "Enable registry auditing for Run keys"
      - "Monitor and baseline startup items"
    platforms: ["Windows", "Linux", "macOS"]
    data_sources: ["Windows Registry: Windows Registry Key Creation", "File: File Creation"]

  # ==========================================================================
  # Privilege Escalation (TA0004)
  # ==========================================================================

  - id: T1055
    name: "Process Injection"
    tactic_ids: ["TA0004", "TA0005"]
    description: >
      Adversaries may inject code into processes in order to evade process-based
      defences as well as possibly elevate privileges.
    detection_notes: >
      Monitor for cross-process memory operations (CreateRemoteThread, WriteProcessMemory).
      Enable EDR process injection detection. Look for unusual process relationships.
    mitigations:
      - "Enable EDR with injection detection capability"
      - "Apply credential guard"
      - "Use virtualisation-based security (VBS)"
    platforms: ["Windows", "Linux", "macOS"]
    data_sources: ["Process: OS API Execution", "Process: Process Access", "Process: Process Modification"]

  # ==========================================================================
  # Defence Evasion (TA0005)
  # ==========================================================================

  - id: T1036
    name: "Masquerading"
    tactic_ids: ["TA0005"]
    description: >
      Adversaries may attempt to manipulate features of their artifacts to make
      them appear legitimate or benign to users and/or security tools.
    detection_notes: >
      Monitor for processes with names matching system utilities but running from
      unusual paths. Check file signature validity. Detect typosquatting in process names.
    mitigations:
      - "Apply application control based on path and digital signature"
      - "Enable process name validation in EDR"
    platforms: ["Windows", "Linux", "macOS"]
    data_sources: ["File: File Metadata", "Process: Process Creation"]

  - id: T1027
    name: "Obfuscated Files or Information"
    tactic_ids: ["TA0005"]
    description: >
      Adversaries may attempt to make an executable or file difficult to discover
      or analyse by encrypting, encoding, or otherwise obfuscating its contents.
    detection_notes: >
      Flag high-entropy files and scripts. Detect Base64-encoded PowerShell commands.
      Enable deobfuscation capabilities in endpoint security products.
    mitigations:
      - "Enable AMSI (Antimalware Scan Interface)"
      - "Deploy script analysis in security tooling"
    platforms: ["Windows", "Linux", "macOS"]
    data_sources: ["File: File Metadata", "Script: Script Execution", "Command: Command Execution"]

  # ==========================================================================
  # Credential Access (TA0006)
  # ==========================================================================

  - id: T1003
    name: "OS Credential Dumping"
    tactic_ids: ["TA0006"]
    description: >
      Adversaries may attempt to dump credentials to obtain account login and
      credential material, normally in the form of a hash or a clear text password.
    detection_notes: >
      Monitor for LSASS memory access (Event ID 10 Sysmon: ProcessAccess targeting lsass.exe).
      Detect Mimikatz/ProcDump execution patterns. Enable Credential Guard.
    mitigations:
      - "Enable Windows Credential Guard"
      - "Restrict LSASS access with Protected Process Light (PPL)"
      - "Monitor and alert on LSASS memory access"
    platforms: ["Windows", "Linux", "macOS"]
    data_sources: ["Command: Command Execution", "Process: OS API Execution", "Process: Process Access"]

  - id: T1110
    name: "Brute Force"
    tactic_ids: ["TA0006"]
    description: >
      Adversaries may use brute force techniques to gain access to accounts when
      passwords are unknown or when password hashes are obtained.
    detection_notes: >
      Monitor for high volumes of failed authentication events (Event ID 4625).
      Detect password spray patterns (low-and-slow across many accounts).
      Alert on account lockouts.
    mitigations:
      - "Implement account lockout policy"
      - "Deploy MFA"
      - "Enable anomalous login detection"
    platforms: ["Windows", "Azure AD", "Office 365", "Linux", "macOS"]
    data_sources: ["User Account: User Account Authentication", "Application Log: Application Log Content"]

  # ==========================================================================
  # Discovery (TA0007)
  # ==========================================================================

  - id: T1046
    name: "Network Service Discovery"
    tactic_ids: ["TA0007"]
    description: >
      Adversaries may attempt to get a listing of services running on remote hosts
      and local network infrastructure devices, including those that may be
      vulnerable and primed for exploitation.
    detection_notes: >
      Detect port scanning activity from internal hosts. Monitor for nmap/masscan
      process execution. Alert on unusually high connection attempts to multiple ports.
    mitigations:
      - "Implement network segmentation"
      - "Apply host-based firewall rules"
      - "Enable network flow monitoring"
    platforms: ["Windows", "Linux", "macOS", "Network"]
    data_sources: ["Network Traffic: Network Traffic Flow", "Cloud Service: Cloud Service Enumeration"]

  - id: T1082
    name: "System Information Discovery"
    tactic_ids: ["TA0007"]
    description: >
      An adversary may attempt to get detailed information about the operating
      system and hardware, including version, patches, hotfixes, service packs,
      and architecture.
    detection_notes: >
      Monitor for systeminfo.exe, ver, uname -a execution. Watch for WMI queries
      for OS version information from unusual processes.
    mitigations:
      - "Monitor and alert on system enumeration commands in unexpected contexts"
    platforms: ["Windows", "Linux", "macOS"]
    data_sources: ["Command: Command Execution", "Process: OS API Execution", "Process: Process Creation"]

  # ==========================================================================
  # Lateral Movement (TA0008)
  # ==========================================================================

  - id: T1021
    name: "Remote Services"
    tactic_ids: ["TA0008"]
    description: >
      Adversaries may use Valid Accounts to log into a service specifically
      designed to accept remote connections, such as telnet, SSH, and VNC.
    detection_notes: >
      Monitor for RDP (3389), WinRM (5985/5986), SSH connections from unusual
      source hosts. Alert on service account lateral movement.
    mitigations:
      - "Restrict access to remote services via firewall rules"
      - "Require MFA for RDP/VPN"
      - "Enable just-in-time (JIT) access"
    platforms: ["Windows", "Linux", "macOS"]
    data_sources: ["Logon Session: Logon Session Creation", "Network Traffic: Network Traffic Flow"]

  - id: T1021.001
    name: "Remote Services: Remote Desktop Protocol"
    tactic_ids: ["TA0008"]
    description: >
      Adversaries may use Valid Accounts to log into a computer using the Remote
      Desktop Protocol (RDP). The adversary may then perform actions as the
      logged-on user.
    detection_notes: >
      Monitor Windows Event ID 4624 (Type 10 = RemoteInteractive logon).
      Alert on RDP from non-standard source hosts or unusual time windows.
    mitigations:
      - "Block RDP from internet-facing interfaces"
      - "Use a VPN or jump server for remote administration"
      - "Enable Network Level Authentication (NLA)"
    platforms: ["Windows"]
    data_sources: ["Logon Session: Logon Session Creation", "Network Traffic: Network Traffic Flow", "Process: Process Creation"]

  - id: T1570
    name: "Lateral Tool Transfer"
    tactic_ids: ["TA0008"]
    description: >
      Adversaries may transfer tools or other files between systems in a
      compromised environment.
    detection_notes: >
      Monitor for admin share access (\\host\C$) from unusual sources.
      Detect file copying utilities (robocopy, xcopy, scp) used by unusual processes.
    mitigations:
      - "Disable unnecessary admin share access"
      - "Monitor and alert on lateral file transfers"
    platforms: ["Windows", "Linux", "macOS"]
    data_sources: ["File: File Creation", "Network Traffic: Network Traffic Flow", "Network Share: Network Share Access"]

  # ==========================================================================
  # Collection (TA0009)
  # ==========================================================================

  - id: T1005
    name: "Data from Local System"
    tactic_ids: ["TA0009"]
    description: >
      Adversaries may search local system sources, such as file systems and
      configuration files or local databases, to find files of interest and
      sensitive data prior to Exfiltration.
    detection_notes: >
      Monitor for access to sensitive file locations (documents, profiles, config dirs).
      Watch for bulk file reads or archiving commands in unusual contexts.
    mitigations:
      - "Apply file access auditing to sensitive directories"
      - "Implement DLP controls"
    platforms: ["Windows", "Linux", "macOS"]
    data_sources: ["Command: Command Execution", "File: File Access", "Process: Process Creation"]

  # ==========================================================================
  # Command and Control (TA0011)
  # ==========================================================================

  - id: T1071
    name: "Application Layer Protocol"
    tactic_ids: ["TA0011"]
    description: >
      Adversaries may communicate using application layer protocols to avoid
      detection/network filtering by blending in with existing traffic.
    detection_notes: >
      Detect beaconing patterns (regular outbound connections at fixed intervals).
      Monitor for HTTPS traffic to newly registered domains.
      Enable DNS query logging and alert on DGA-like domains.
    mitigations:
      - "Deploy network proxy with SSL inspection"
      - "Block traffic to known malicious domains/IPs"
      - "Monitor for unusual TLS certificate characteristics"
    platforms: ["Windows", "Linux", "macOS", "Network"]
    data_sources: ["Network Traffic: Network Traffic Content", "Network Traffic: Network Traffic Flow"]

  - id: T1071.001
    name: "Application Layer Protocol: Web Protocols"
    tactic_ids: ["TA0011"]
    description: >
      Adversaries may communicate using application layer protocols associated
      with web traffic to avoid detection. Commands to the remote system, and
      often the results of those commands, will be embedded within the protocol
      traffic between the client and server.
    detection_notes: >
      Monitor outbound HTTP/HTTPS to unusual destinations. Inspect user agents for
      non-browser patterns. Detect high-frequency beaconing to single destination.
    mitigations:
      - "Enforce proxy usage for all outbound web traffic"
      - "Block direct outbound connections to ports 80/443 from servers"
    platforms: ["Windows", "Linux", "macOS", "Network"]
    data_sources: ["Network Traffic: Network Traffic Content", "Network Traffic: Network Traffic Flow"]

  - id: T1105
    name: "Ingress Tool Transfer"
    tactic_ids: ["TA0011"]
    description: >
      Adversaries may transfer tools or other files from an external system into
      a compromised environment.
    detection_notes: >
      Monitor for unusual downloads (certutil, bitsadmin, curl, wget used for
      downloads). Alert on binaries created in user-writable directories.
    mitigations:
      - "Block outbound downloads from non-standard processes"
      - "Deploy application control to prevent execution from user directories"
    platforms: ["Windows", "Linux", "macOS"]
    data_sources: ["File: File Creation", "Network Traffic: Network Traffic Content", "Process: Process Creation"]

  # ==========================================================================
  # Exfiltration (TA0010)
  # ==========================================================================

  - id: T1041
    name: "Exfiltration Over C2 Channel"
    tactic_ids: ["TA0010"]
    description: >
      Adversaries may steal data by exfiltrating it over an existing command and
      control channel. Stolen data is encoded into the normal communications channel
      using the same protocol as command and control communications.
    detection_notes: >
      Monitor for large data volumes over established C2 channels.
      Detect unusual data upload patterns to external IPs.
      Enable DLP on proxy/gateway.
    mitigations:
      - "Deploy DLP at network egress points"
      - "Block outbound traffic to known bad destinations"
      - "Monitor for large data transfers to external systems"
    platforms: ["Windows", "Linux", "macOS", "Network"]
    data_sources: ["Command: Command Execution", "File: File Access", "Network Traffic: Network Traffic Content", "Network Traffic: Network Traffic Flow"]

  - id: T1567
    name: "Exfiltration Over Web Service"
    tactic_ids: ["TA0010"]
    description: >
      Adversaries may use an existing, legitimate external Web service to
      exfiltrate data rather than their primary command and control channel.
    detection_notes: >
      Monitor for large uploads to cloud storage services (Dropbox, Google Drive, etc.)
      from endpoints that do not normally use such services.
    mitigations:
      - "Block access to personal cloud storage from corporate devices"
      - "Implement DLP with cloud connector visibility"
    platforms: ["Windows", "Linux", "macOS"]
    data_sources: ["Application Log: Application Log Content", "Network Traffic: Network Traffic Content"]

  # ==========================================================================
  # Impact (TA0040)
  # ==========================================================================

  - id: T1486
    name: "Data Encrypted for Impact"
    tactic_ids: ["TA0040"]
    description: >
      Adversaries may encrypt data on target systems or on large numbers of
      systems in a network to interrupt availability to system and network resources.
    detection_notes: >
      Monitor for rapid file modification/encryption events (high volume of
      write operations to multiple file extensions). Detect shadow copy deletion
      (vssadmin delete shadows).
    mitigations:
      - "Maintain offline backups with tested recovery procedures"
      - "Apply endpoint protection with anti-ransomware capability"
      - "Restrict write access to shared drives"
    platforms: ["Windows", "Linux", "macOS", "IaaS"]
    data_sources: ["Cloud Storage: Cloud Storage Modification", "File: File Creation", "File: File Modification", "Process: Process Creation"]

  - id: T1485
    name: "Data Destruction"
    tactic_ids: ["TA0040"]
    description: >
      Adversaries may destroy data and files on specific systems or in large
      numbers on a network to interrupt availability to systems, services, and
      network resources.
    detection_notes: >
      Monitor for disk wiping utilities and commands (sdelete, cipher /w, dd if=/dev/zero).
      Detect mass file deletion events.
    mitigations:
      - "Maintain tested offline backups"
      - "Implement file access controls and auditing"
    platforms: ["Windows", "Linux", "macOS", "IaaS"]
    data_sources: ["File: File Deletion", "Process: Process Creation"]
